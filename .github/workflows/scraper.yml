name: "Fixture Scraper & Auto-Deploy Trigger (every 3.5h)"

on:
  schedule:
    # Run every 3.5 hours: 00:00, 03:30, 07:00, 10:30, 14:00, 17:30, 21:00 UTC
    - cron: "0 0,7,14,21 * * *"
    - cron: "30 3,10,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    name: "Scrape, model & publish fixtures.json"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run Scraper & Dixon-Coles Probability Modeler
        env:
          NODE_ENV: production
        run: |
          npm run scrape

      - name: Validate Fixture Database Schema & Freshness
        run: |
          node -e "
            import('fs').then(fs => {
              const data = JSON.parse(fs.readFileSync('data/fixtures.json', 'utf8'));
              if (!data.matches || !Array.isArray(data.matches) || data.matches.length < 50) {
                console.error('Fixture validation failed: Insufficient matches in fixtures.json');
                process.exit(1);
              }
              // 1. Freshness Guardrail: Assert matches contain today or future dates
              const now = new Date();
              const nowKey = now.toISOString().slice(0, 10);
              const upcomingMatches = data.matches.filter(m => (m.matchDate || m.kickoff.slice(0, 10)) >= nowKey);
              if (upcomingMatches.length < 10) {
                console.error('Validation failed: No upcoming/future fixtures detected! Date range is expired or stale.');
                process.exit(1);
              }
              // 2. Asset Size Guardrail: Assert data/fixtures.json is strictly under 24MB
              const stats = fs.statSync('data/fixtures.json');
              const sizeMb = stats.size / (1024 * 1024);
              if (sizeMb >= 24) {
                console.error('Validation failed: fixtures.json is ' + sizeMb.toFixed(2) + 'MB (exceeds Cloudflare 24MB ceiling)');
                process.exit(1);
              }
              console.log('✓ Validation passed: ' + data.matches.length + ' fixtures active (' + upcomingMatches.length + ' upcoming), size: ' + sizeMb.toFixed(2) + 'MB.');
            });
          "

      - name: Commit and push updated fixtures (triggers Cloudflare Pages auto-deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Unstage any bulky server cache if generated
          git rm --cached -f data/official_fallback_cache.json 2>/dev/null || true
          echo "{\"last_sync\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",\"schedule\":\"every-3.5h\",\"status\":\"OK\"}" > data/sync_timestamp.json
          git add data/fixtures.json data/sync_timestamp.json
          git commit -m "chore(data): live 3.5h fixture & Dixon-Coles model sync [$(date -u +'%Y-%m-%d %H:%M UTC')]" || echo "No changes to commit"
          git push origin main || git push origin master || echo "Push completed"

      - name: Trigger Cloudflare Pages Deploy Hook (optional)
        if: env.CLOUDFLARE_DEPLOY_HOOK != ''
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          echo "Triggering Cloudflare Pages Deploy Hook..."
          curl -s -X POST "$CLOUDFLARE_DEPLOY_HOOK" || true
