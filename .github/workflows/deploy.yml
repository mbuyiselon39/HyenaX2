name: "Build, Test & Deploy to Cloudflare Pages"

on:
  schedule:
    # Run every 3.5 hours: 00:00, 03:30, 07:00, 10:30, 14:00, 17:30, 21:00 UTC
    - cron: "0 0,7,14,21 * * *"
    - cron: "30 3,10,17 * * *"
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions: write-all

jobs:
  test_and_build:
    name: "Validate Layer 18, Build & Package"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Layer 18 Motivation Modifier & Validation Suite
        run: |
          python3 motivation_modifier.py
          python3 validation_suite.py

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run Linter
        run: npm run lint

      - name: Build Production Assets
        run: npm run build

      - name: Validate Production Build & Cloudflare 25MB Guardrail
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/_headers || (echo "dist/_headers missing" && exit 1)
          test -f dist/_redirects || (echo "dist/_redirects missing" && exit 1)
          test -f dist/data/fixtures.json || (echo "dist/data/fixtures.json missing" && exit 1)
          # Strict Cloudflare Pages 25MB ceiling guardrail (flag any file >= 24MB)
          oversized=$(find dist -type f -size +24M)
          if [ -n "$oversized" ]; then
            echo "FATAL: Found file in dist/ exceeding Cloudflare 24MB threshold:"
            echo "$oversized"
            exit 1
          fi
          # Freshness check: Assert dist/data/fixtures.json has active upcoming fixtures
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('dist/data/fixtures.json', 'utf8'));
            const today = new Date().toISOString().slice(0, 10);
            const upcoming = (data.matches || []).filter(m => (m.matchDate || m.kickoff.slice(0, 10)) >= today);
            if (upcoming.length < 10) {
              console.error('FATAL: Less than 10 upcoming matches in build. Stale/expired date window detected.');
              process.exit(1);
            }
            console.log('✓ Build verification passed: ' + data.matches.length + ' matches (' + upcoming.length + ' active/upcoming).');
          "
          echo "✓ All production build artifacts and Cloudflare size guardrails verified successfully."

      - name: Deploy to Cloudflare Pages (Optional CLI Deploy)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=hyenax || echo "Cloudflare Pages direct CLI deployment skipped or completed via Git integration."
        continue-on-error: true

      - name: Trigger Cloudflare Pages Deploy Hook (Optional)
        if: env.CLOUDFLARE_DEPLOY_HOOK != ''
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          echo "Triggering Cloudflare Pages Deploy Hook..."
          curl -s -X POST "$CLOUDFLARE_DEPLOY_HOOK" || true
