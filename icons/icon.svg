<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#151D2E"/>
      <stop offset="60%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>
  
  <!-- Outer Gold Shield -->
  <polygon points="256,60 410,145 410,325 256,410 102,325 102,145" fill="#0E131F" stroke="url(#goldGrad)" stroke-width="6" filter="url(#goldGlow)"/>
  <polygon points="256,80 390,155 390,315 256,390 122,315 122,155" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>

  <!-- Centered Monogram HX -->
  <g transform="translate(256, 235)">
    <text x="-48" y="30" font-family="'Space Grotesk', system-ui, sans-serif" font-size="140" font-weight="900" fill="#FFFFFF" text-anchor="middle">H</text>
    <text x="48" y="30" font-family="'Space Grotesk', system-ui, sans-serif" font-size="145" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">X</text>
  </g>

  <!-- Gold Star & Accent Nodes -->
  <g fill="#F59E0B">
    <circle cx="256" cy="115" r="7"/>
    <circle cx="230" cy="120" r="4" opacity="0.8"/>
    <circle cx="282" cy="120" r="4" opacity="0.8"/>
  </g>

  <!-- Tagline Text -->
  <text x="256" y="445" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#F59E0B" text-anchor="middle" letter-spacing="3">HYENAX GOLDPACK</text>
  <text x="256" y="470" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="2">THE NDLELA MILLIONAIRES</text>
</svg>
