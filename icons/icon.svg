<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#181308"/>
      <stop offset="60%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#05070A"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldRim)" stroke-width="4" opacity="0.6"/>

  <!-- Outer Medallion Rings -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="url(#goldRim)" stroke-width="12" filter="url(#goldGlow)"/>
  <circle cx="256" cy="230" r="154" fill="#0C0E14" stroke="url(#goldInner)" stroke-width="4"/>

  <!-- Stylized Gold Dollar Sign in background left -->
  <g transform="translate(145, 125) scale(1.1)">
    <path d="M45 10 L45 180 M65 10 L65 180" stroke="url(#goldRim)" stroke-width="8" stroke-linecap="round"/>
    <path d="M85 45 C85 25, 30 20, 30 65 C30 105, 85 95, 85 140 C85 185, 20 180, 20 155" fill="none" stroke="url(#goldRim)" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Stylized Geometric Hyena Head profile facing right -->
  <g transform="translate(210, 110) scale(1.2)" filter="url(#goldGlow)">
    <!-- Ears -->
    <path d="M40 30 L65 -15 L80 20 Z" fill="url(#goldInner)" stroke="url(#goldRim)" stroke-width="2"/>
    <path d="M25 40 L45 0 L55 35 Z" fill="url(#goldRim)" opacity="0.8"/>
    <!-- Mane crest -->
    <path d="M-10 70 L20 20 L45 50 L10 80 Z" fill="url(#goldInner)"/>
    <path d="M-20 110 L0 60 L25 90 L-5 125 Z" fill="url(#goldRim)"/>
    <!-- Head and Muzzle -->
    <path d="M20 50 L75 35 L120 75 L115 105 L70 110 L40 135 L15 120 Z" fill="url(#goldInner)" stroke="url(#goldRim)" stroke-width="3"/>
    <!-- Snout & Jaw -->
    <path d="M70 110 L115 105 L130 95 L110 120 L75 125 Z" fill="url(#goldRim)"/>
    <!-- Fierce Diamond Eye -->
    <polygon points="65,65 78,58 72,70 60,68" fill="#FFFFFF" stroke="#000" stroke-width="1.5"/>
    <circle cx="68" cy="64" r="2.5" fill="#000"/>
  </g>

  <!-- Bottom Brand Text: HyenaX -->
  <text x="220" y="445" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="url(#goldRim)" text-anchor="middle" letter-spacing="4">HYENA</text>
  <!-- Stylized Gold/Black X -->
  <text x="325" y="445" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-size="48" font-weight="900" fill="#FBBF24" stroke="#000" stroke-width="2" text-anchor="middle">X</text>
  <!-- Slogan -->
  <text x="256" y="475" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#D1D5DB" text-anchor="middle" letter-spacing="1.5">THE NDLELA MILLIONAIRES GOLDPACK</text>
</svg>
