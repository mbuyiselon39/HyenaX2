<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Cyberpunk Obsidian Background -->
    <radialGradient id="cyberBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#12182B"/>
      <stop offset="45%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>

    <!-- Neon Royal Purple Gradient -->
    <linearGradient id="purpleNeon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="50%" stop-color="#651FFF"/>
      <stop offset="100%" stop-color="#B388FF"/>
    </linearGradient>

    <!-- Amber Gold Accent -->
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="25%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>

    <!-- Isometric Face Shading Gradients -->
    <linearGradient id="isoTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="isoLeftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="isoRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2234"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cubeDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#00E5FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Obsidian Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#cyberBg)"/>
  <rect x="8" y="8" width="496" height="496" rx="92" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Rotating Isometric Coordinate Grid Floor -->
  <g opacity="0.3" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3,3">
    <!-- Isometric Grid Lines -->
    <line x1="80" y1="360" x2="256" y2="460"/>
    <line x1="120" y1="330" x2="296" y2="430"/>
    <line x1="160" y1="300" x2="336" y2="400"/>
    <line x1="200" y1="270" x2="376" y2="370"/>
    <line x1="240" y1="240" x2="416" y2="340"/>

    <line x1="432" y1="360" x2="256" y2="460"/>
    <line x1="392" y1="330" x2="216" y2="430"/>
    <line x1="352" y1="300" x2="176" y2="400"/>
    <line x1="312" y1="270" x2="136" y2="370"/>
    <line x1="272" y1="240" x2="96" y2="340"/>
  </g>

  <!-- Ambient Under-Glow Radial -->
  <circle cx="256" cy="225" r="140" fill="#00E5FF" opacity="0.08" filter="url(#cyanGlow)"/>
  <circle cx="256" cy="225" r="90" fill="#FFD700" opacity="0.06" filter="url(#goldGlow)"/>

  <!-- ==================== 3D ISOMETRIC ALGORITHMIC DATA CUBE ==================== -->
  <g id="isoDataCube" filter="url(#cubeDropShadow)" transform="translate(256, 215)">
    
    <!-- Outer Tier 1 Isometric Bounds -->
    <!-- Top Face (Hex/Diamond) -->
    <polygon points="0,-120 104,-60 0,0 -104,-60" fill="url(#isoTopGrad)" stroke="url(#cyberGradient)" stroke-width="2.5"/>
    <!-- Left Face -->
    <polygon points="-104,-60 0,0 0,120 -104,60" fill="url(#isoLeftGrad)" stroke="rgba(0,229,255,0.4)" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="0,0 104,-60 104,60 0,120" fill="url(#isoRightGrad)" stroke="rgba(124,77,255,0.5)" stroke-width="2"/>

    <!-- Inner Algorithmic Core Planes (3D Nested Layer Nodes) -->
    <!-- Layer 18 Floating Hex Node -->
    <polygon points="0,-85 70,-45 0,-5 -70,-45" fill="none" stroke="url(#accentGold)" stroke-width="3" filter="url(#goldGlow)"/>
    <circle cx="0" cy="-45" r="7" fill="#FFD700" filter="url(#goldGlow)"/>
    
    <!-- Isometric Axis Struts -->
    <line x1="0" y1="0" x2="0" y2="120" stroke="url(#cyberGradient)" stroke-width="3"/>
    <line x1="0" y1="0" x2="-104" y2="-60" stroke="url(#cyberGradient)" stroke-width="2"/>
    <line x1="0" y1="0" x2="104" y2="-60" stroke="url(#purpleNeon)" stroke-width="2"/>

    <!-- Left Face Circuit Traces (Ensemble Nodes) -->
    <g stroke="#00E5FF" stroke-width="1.8" fill="none" opacity="0.85">
      <path d="M-80,-20 L-40,5 L-40,65"/>
      <circle cx="-80" cy="-20" r="3.5" fill="#00E5FF"/>
      <circle cx="-40" cy="65" r="4.5" fill="#00E5FF" filter="url(#cyanGlow)"/>
      <path d="M-65,25 L-20,50 L-20,95"/>
      <circle cx="-65" cy="25" r="3" fill="#00E5FF"/>
      <circle cx="-20" cy="95" r="3.5" fill="#00E5FF"/>
    </g>

    <!-- Right Face Data Strata (Poisson & Neural Weights) -->
    <g stroke="#7C4DFF" stroke-width="1.8" fill="none" opacity="0.9">
      <path d="M80,-20 L40,5 L40,65"/>
      <circle cx="80" cy="-20" r="3.5" fill="#7C4DFF"/>
      <circle cx="40" cy="65" r="4.5" fill="#7C4DFF" filter="url(#cyanGlow)"/>
      <path d="M65,25 L20,50 L20,95"/>
      <circle cx="65" cy="25" r="3" fill="#7C4DFF"/>
      <circle cx="20" cy="95" r="3.5" fill="#7C4DFF"/>
    </g>

    <!-- Central Glowing Core Node: HyenaX Neural Nexus -->
    <circle cx="0" cy="0" r="14" fill="#060913" stroke="url(#accentGold)" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#FFD700" filter="url(#goldGlow)"/>

    <!-- Dynamic 3D Projection Rays -->
    <line x1="0" y1="-120" x2="0" y2="-140" stroke="#FFD700" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="0,-146 5,-138 -5,-138" fill="#FFD700"/>
  </g>

  <!-- Floating Orbital Data Rings -->
  <ellipse cx="256" cy="215" rx="160" ry="60" fill="none" stroke="url(#cyberGradient)" stroke-width="1.5" stroke-dasharray="14,10" opacity="0.6"/>
  <ellipse cx="256" cy="215" rx="180" ry="70" fill="none" stroke="url(#accentGold)" stroke-width="1.2" stroke-dasharray="8,16" opacity="0.45" transform="rotate(-15, 256, 215)"/>

  <!-- ==================== BRAND TYPOGRAPHY ==================== -->
  <g transform="translate(256, 420)">
    <!-- Brand Title -->
    <text x="-16" y="0" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">HYENA</text>
    <text x="74" y="0" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="48" font-weight="900" fill="url(#accentGold)" text-anchor="middle" filter="url(#goldGlow)">X</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="32" font-family="'Inter', 'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#00E5FF" text-anchor="middle" letter-spacing="3.5" opacity="0.95">THE NDLELA MILLIONAIRES GOLDPACK</text>
    <text x="0" y="52" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">18-LAYER QUANTITATIVE INTELLIGENCE STACK</text>
  </g>
</svg>
